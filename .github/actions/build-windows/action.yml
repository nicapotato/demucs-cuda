name: build-windows
description: Build demucs_cuda_worker.exe (MSVC + CUDA, static cudart/CRT/lame)

inputs:
  cuda-version:
    description: CUDA toolkit version
    required: true
  archs:
    description: DC_CUDA_ARCHS
    required: false
    default: "75;80;86;89;120"

runs:
  using: composite
  steps:
    - uses: Jimver/cuda-toolkit@v0.2.24
      with:
        cuda: ${{ inputs.cuda-version }}
        method: network
        sub-packages: '["nvcc", "cudart", "nvtx", "visual_studio_integration"]'

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        vsversion: "2022"

    - name: Restore vcpkg packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-bin
        key: vcpkg-mp3lame-x64-windows-static-v1

    - name: Install lame (static)
      shell: pwsh
      env:
        VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-bin
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install mp3lame:x64-windows-static
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Configure + build
      shell: pwsh
      run: |
        cmake -S worker-cuda -B worker-cuda/build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DDC_BACKEND=cuda `
          "-DDC_CUDA_ARCHS=${{ inputs.archs }}" `
          -DDC_BUILD_TESTS=ON `
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build worker-cuda/build --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
