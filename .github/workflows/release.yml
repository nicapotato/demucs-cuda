name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (leave empty to use project.conf)"
        required: false
        default: ""
        type: string
      publish_gh_release:
        description: "Create git tag + GitHub Release assets"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CUDA_VERSION: "12.8.1"
  GH_TOKEN: ${{ github.token }}

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      models_tag: ${{ steps.v.outputs.models_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION}"
          else
            V=$(grep '^VERSION=' project.conf | cut -d= -f2 | tr -d '[:space:]')
          fi
          MODELS_TAG=$(grep '^MODELS_RELEASE_TAG=' project.conf | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$V" ] || [ -z "$MODELS_TAG" ]; then
            echo "ERROR: VERSION / MODELS_RELEASE_TAG missing from project.conf" >&2
            exit 1
          fi
          if ! gh release view "${MODELS_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "ERROR: weights release ${MODELS_TAG} not found. Publish it once from a Mac with 'make models-release'." >&2
            exit 1
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "models_tag=${MODELS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${V} (tag v${V}); models ${MODELS_TAG}"

  build-worker:
    runs-on: windows-latest
    needs: read-version
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.read-version.outputs.version }}
      MODELS_TAG: ${{ needs.read-version.outputs.models_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          cuda-version: ${{ env.CUDA_VERSION }}

      - name: Download pinned fp16 weights
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pin
          gh release download "${MODELS_TAG}" --repo "${GITHUB_REPOSITORY}" \
            -p 'htdemucs-6s-fp16.zip' -p 'htdemucs-6s-fp16.zip.sha256' -D /tmp/pin
          (cd /tmp/pin && sha256sum -c htdemucs-6s-fp16.zip.sha256)
          unzip -o /tmp/pin/htdemucs-6s-fp16.zip -d .
          ls -la models

      - name: Smoke test
        shell: pwsh
        run: |
          $env:DEMUCS_CUDA_CACHE = Join-Path (Get-Location) "models"
          & worker-cuda/build/demucs_cuda_worker.exe --list-models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py
          (
            cd release-assets
            sha256sum ./*.zip | tee SHA256SUMS
            sha256sum "demucs-cuda-windows-worker-v${VERSION}.zip" \
              | tee "demucs-cuda-windows-worker-v${VERSION}.zip.sha256"
          )
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: demucs-cuda-windows-worker-release
          path: release-assets/*
          if-no-files-found: error

  publish-gh-release:
    runs-on: ubuntu-latest
    needs: [read-version, build-worker]
    if: github.event.inputs.publish_gh_release == 'true'
    env:
      TAG: ${{ needs.read-version.outputs.tag }}
      VERSION: ${{ needs.read-version.outputs.version }}
      MODELS_TAG: ${{ needs.read-version.outputs.models_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard duplicate worker tag
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${TAG} already exists; bump VERSION in project.conf" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: demucs-cuda-windows-worker-release
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: demucs-cuda ${{ env.TAG }}
          generate_release_notes: true
          body: |
            Native CUDA worker (C + CUDA, no Python/PyTorch) for [demucs-ui-app](https://github.com/nicapotato/demucs-ui-app).
            Requires an NVIDIA GPU (Turing / sm_75 or newer) and driver R570+.

            ## Assets
            - `demucs-cuda-windows-worker-v${{ env.VERSION }}.zip`: `worker/demucs_cuda_worker.exe` + fp16 `models/`
            - `htdemucs-6s-fp16.zip`: fp16 weights only

            Weights are pinned on immutable release `${{ env.MODELS_TAG }}`.
          files: |
            release-assets/*
